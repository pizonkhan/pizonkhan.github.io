name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deployment needs these; the default GITHUB_TOKEN is read-only otherwise.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel so a merged PR always lands.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail the deploy on a type error rather than shipping a broken page.
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          # Public by design (see lib/analytics/config.ts): baked into the client bundle,
          # not a secret. Points at the Worker deployed from workers/site-analytics/.
          NEXT_PUBLIC_ANALYTICS_ENDPOINT: https://pk-site-analytics.pizonkhan.workers.dev

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
